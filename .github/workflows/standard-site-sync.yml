name: Standard.Site Sync

on:
  push:
    branches: [main]
    paths:
      - "apps/www/src/content/releases/**"
      - "apps/www/src/lib/releases.ts"
      - "apps/www/src/lib/standard-site/**"
      - "apps/www/scripts/sync-standard-site.ts"
      - "apps/www/scripts/lib/standard-site-content.ts"
      - ".github/workflows/standard-site-sync.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only print the planned changes
        required: false
        default: false
        type: boolean
      allow_large_delete:
        description: Allow deleting more than five publication documents
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: standard-site-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Check Standard.Site configuration
        id: configuration
        env:
          WWW_STANDARD_SITE_PDS_URL: ${{ vars.WWW_STANDARD_SITE_PDS_URL }}
          WWW_STANDARD_SITE_IDENTIFIER: ${{ vars.WWW_STANDARD_SITE_IDENTIFIER }}
          WWW_STANDARD_SITE_APP_PASSWORD: ${{ secrets.WWW_STANDARD_SITE_APP_PASSWORD }}
          WWW_STANDARD_SITE_PUBLICATION_URI: ${{ vars.WWW_STANDARD_SITE_PUBLICATION_URI }}
          WWW_STANDARD_SITE_SYNC_ENABLED: ${{ vars.WWW_STANDARD_SITE_SYNC_ENABLED }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" && "$WWW_STANDARD_SITE_SYNC_ENABLED" != "true" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Automatic Standard.Site sync is not enabled; skipping sync."
          elif [[ -n "$WWW_STANDARD_SITE_PDS_URL" && -n "$WWW_STANDARD_SITE_IDENTIFIER" && -n "$WWW_STANDARD_SITE_APP_PASSWORD" && -n "$WWW_STANDARD_SITE_PUBLICATION_URI" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Standard.Site credentials are not configured; skipping sync."
          fi

      - uses: actions/checkout@v4
        if: steps.configuration.outputs.enabled == 'true'

      - uses: pnpm/action-setup@v4
        if: steps.configuration.outputs.enabled == 'true'

      - uses: actions/setup-node@v4
        if: steps.configuration.outputs.enabled == 'true'
        with:
          node-version-file: .node-version
          cache: pnpm

      - if: steps.configuration.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile

      - name: Sync Standard.Site records
        if: steps.configuration.outputs.enabled == 'true'
        run: pnpm --filter @serial/www standard-site:sync ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.allow_large_delete && '--allow-large-delete' || '' }}
        env:
          WWW_STANDARD_SITE_PDS_URL: ${{ vars.WWW_STANDARD_SITE_PDS_URL }}
          WWW_STANDARD_SITE_IDENTIFIER: ${{ vars.WWW_STANDARD_SITE_IDENTIFIER }}
          WWW_STANDARD_SITE_APP_PASSWORD: ${{ secrets.WWW_STANDARD_SITE_APP_PASSWORD }}
          WWW_STANDARD_SITE_PUBLICATION_URI: ${{ vars.WWW_STANDARD_SITE_PUBLICATION_URI }}
